name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          
      - name: Clone engine262
        uses: actions/checkout@v7
        with:
          repository: sirisian/engine262-proposal-runtime-types
          ref: proposal-runtime-types
          path: engine262
          
      - name: Clone test262
        uses: actions/checkout@v7
        with:
          repository: tc39/test262
          ref: main
          fetch-depth: 1
          sparse-checkout: harness
          sparse-checkout-cone-mode: true
          path: engine262/test/test262/test262
          
      - name: Build engine262
        working-directory: engine262
        run: npm ci && npm run build
        
      - name: Link engine262
        run: ln -s "$GITHUB_WORKSPACE/engine262" lib/engine262
        
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build

      - name: Inject engine and fix paths for GitHub Pages
        run: |
          # 1. Create the engine262 folder inside the final deployment directory
          mkdir -p dist/engine262
          
          # 2. Copy the compiled core engine files into it so GitHub Pages hosts them
          cp -r engine262/lib/* dist/engine262/
          
          # 3. Rewrite absolute paths in HTML files (root level -> ./ )
          find dist -type f -name "*.html" -exec sed -i 's|/engine262/|./engine262/|g' {} +
          
          # 4. Rewrite absolute paths in JS files (inside classic/ and devtools/ folders -> ../ )
          find dist -type f -name "*.js" -exec sed -i 's|/engine262/|../engine262/|g' {} +
      
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
