<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>engine262 playground</title>
  <link rel="modulepreload" href="/devtools/262_worker.js" as="script" />
  <meta
    http-equiv="Content-Security-Policy"
    content="object-src 'none'; script-src 'self' 'sha256-d3x55V/MizwfHUlc5lSMCdTdI1XuKsy0K2RqBWelw08=' https://chrome-devtools-frontend.appspot.com https://cdn.jsdelivr.net/ https://engine262.js.org/"
  />
  <meta name="referrer" content="no-referrer" />
  <link href="/devtools/style.css" rel="stylesheet" />
  <link href="/devtools/application_tokens.css" rel="stylesheet" />
  <link href="/devtools/design_system_tokens.css" rel="stylesheet" />
  <template id="engine262-readme-template">
    <main id="engine262-readme">
      <div class="page-title" role="heading" aria-level="1">
        <a href="https://github.com/engine262/engine262/" target="_blank">engine262</a>
        <span></span>
      </div>
      <a href="https://github.com/engine262/engine262" target="_blank">
        <span id="star-me">Star me on GitHub</span>
      </a>
      <article></article>
    </main>
  </template>

  <body class="undocked" id="-blink-dev-tools">
    <dialog id="loading">Loading...</dialog>
    <div id="fork" class="card-wrap"></div>
    <script>
      const loading = document.querySelector("#loading");
      try {
        loading.showModal();
      } catch (e) {}
      window.addEventListener("loaded", () => {
        try {
          loading.close();
        } catch (e) {}
      });
      window.addEventListener("error", () => {
        try {
          loading.close();
        } catch (e) {}
      });
    </script>
    <script type="module" src="/devtools/index.js"></script>
  </body>
</html>
